name: Build and publish storage site release

on:
  push:
    tags: ["storage-web-v*"]

permissions: {contents: read}

concurrency:
  group: pages-storage-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
  GIT_CONFIG_COUNT: "0"
  GIT_CONFIG_PARAMETERS: ""
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: /bin/false
  SSH_ASKPASS: /bin/false
  GIT_ALLOW_PROTOCOL: https
  GIT_PROTOCOL_FROM_USER: "0"
  GH_HOST: github.com
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {contents: read}
    outputs:
      pages_digest: ${{ steps.package.outputs.pages_digest }}
      pages_size: ${{ steps.package.outputs.pages_size }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify exact annotated source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^storage-web-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          d="$(mktemp -d)"
          set +e
          python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          status="$?"
          set -e
          test "$status" = 0
          test "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536
          test ! -s "$d/out" -a ! -s "$d/err"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          rm -rf "$d"
      - uses: actions/setup-node@v7.0.0
        with: {node-version: "22.23.2", cache: npm}
      - name: Verify exact versions and vendored provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.2
          test "$(npm --version)" = 10.9.8
          version="${RELEASE_TAG#storage-web-v}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          test "$version" = "$(node -p 'JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).packages[""].version')"
          test "$(node -p 'require("./package.json").dependencies["@telecrypt-io/storage"]')" = 0.5.10
          bash scripts/verify-shared-ui-release.sh
          sdk_tag=v0.5.10
          sdk_release="$RUNNER_TEMP/storage-sdk-release.json"
          sdk_record="$RUNNER_TEMP/storage-sdk-release.integrity.json"
          sdk_archive="$RUNNER_TEMP/storage-sdk-release.tgz"
          sdk_record_name="$sdk_tag.integrity.json"
          sdk_archive_name="$sdk_tag.tgz"
          python3 scripts/bounded-command.py --stdout "$sdk_release" --stderr "$sdk_release.err" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/TeleCrypt-io/storage-sdk/releases/tags/$sdk_tag"
          jq -e --arg tag "$sdk_tag" --arg record "$sdk_record_name" --arg archive "$sdk_archive_name" '(.tag_name==$tag and .draft==false and .prerelease==false and .immutable==true and (.target_commitish|type=="string" and test("^[0-9a-f]{40}$")) and (.assets|type=="array" and length==2) and all(.assets[]; type=="object" and (.id|type=="number" and .>0) and .state=="uploaded") and any(.assets[]; type=="object" and .name==$record and .state=="uploaded" and (.size|type=="number" and .>0) and (.digest|type=="string" and test("^sha256:[0-9a-f]{64}$"))) and any(.assets[]; type=="object" and .name==$archive and .state=="uploaded" and (.size|type=="number" and .>0) and (.digest|type=="string" and test("^sha256:[0-9a-f]{64}$"))))' "$sdk_release" >/dev/null
          record_id="$(jq -er --arg name "$sdk_record_name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$sdk_release")"
          record_size="$(jq -er --arg name "$sdk_record_name" '.assets[] | select(.name==$name) | .size | select(type=="number" and .>0 and floor==.)' "$sdk_release")"
          record_digest="$(jq -er --arg name "$sdk_record_name" '.assets[] | select(.name==$name) | .digest | select(type=="string" and test("^sha256:[0-9a-f]{64}$"))' "$sdk_release")"
          python3 scripts/bounded-command.py --stdout "$sdk_record" --stderr "$sdk_record.err" --max-stdout-bytes 104857600 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/TeleCrypt-io/storage-sdk/releases/assets/$record_id"
          test "$(wc -c <"$sdk_record")" = "$record_size" -a "sha256:$(sha256sum "$sdk_record" | awk '{print $1}')" = "$record_digest" -a ! -s "$sdk_record.err"
          archive_id="$(jq -er --arg name "$sdk_archive_name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$sdk_release")"
          python3 scripts/bounded-command.py --stdout "$sdk_archive" --stderr "$sdk_archive.err" --max-stdout-bytes 104857600 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/TeleCrypt-io/storage-sdk/releases/assets/$archive_id"
          test ! -s "$sdk_archive.err"
          test "$(jq -er '.commit' "$sdk_record")" = "$(jq -er '.target_commitish' "$sdk_release")"
          node scripts/verify-storage-sdk-lock.mjs "$sdk_record" "$sdk_archive"
          test "$(head -n 1 LICENSE)" = "Business Source License 1.1"
          node scripts/verify-provenance.mjs
      - name: Test and build the Pages tree
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          bounded_command "$RUNNER_TEMP/storage-npm-ci.out" 600 npm ci --ignore-scripts --no-fund --no-audit --loglevel=error
          bounded_command "$RUNNER_TEMP/storage-verify-security.out" 300 npm run verify:security --loglevel=error
          bounded_command "$RUNNER_TEMP/storage-verify-archive.out" 300 npm run verify:archive --loglevel=error
          bounded_command "$RUNNER_TEMP/storage-test.out" 600 npm test --loglevel=error
          bounded_command "$RUNNER_TEMP/storage-lint.out" 300 npm run lint --loglevel=error
          bounded_command "$RUNNER_TEMP/storage-typecheck.out" 300 npm run typecheck --loglevel=error
          bounded_command "$RUNNER_TEMP/storage-build.out" 600 npm run build --loglevel=error
      - name: Package the deterministic Pages artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#storage-web-v}"
          archive="storage-web-$version.pages.zip"
          mkdir -p release-assets
          bounded_package() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          bounded_package "$RUNNER_TEMP/storage-package-pages.out" 300 bash scripts/package-pages.sh dist "release-assets/$archive" "$(git show -s --format=%ct "$RELEASE_SHA")"
          bounded_package "$RUNNER_TEMP/storage-package-validate.out" 300 python3 scripts/validate-pages-archive.py "release-assets/$archive"
          size="$(wc -c <"release-assets/$archive")"
          test "$size" -gt 0
          printf 'pages_digest=sha256:%s\npages_size=%s\n' "$(sha256sum "release-assets/$archive" | awk '{print $1}')" "$size" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: storage-pages-${{ github.run_id }}-${{ github.sha }}
          path: release-assets/*.pages.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: write}
    outputs:
      release_id: ${{ steps.publish.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.pages_digest }}
      EXPECTED_SIZE: ${{ needs.build.outputs.pages_size }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: storage-pages-${{ github.run_id }}-${{ github.sha }}
          path: release-assets
      - name: Create or reuse the exact draft Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^storage-web-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          verify_source() {
            local d status release_commit
            d="$(mktemp -d)"
            set +e
            python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
            status="$?"
            set -e
            test "$status" = 0
            test "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536
            test ! -s "$d/out" -a ! -s "$d/err"
            test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
            release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
            test "$release_commit" = "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
            git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
            rm -rf "$d"
          }
          verify_source
          version="${RELEASE_TAG#storage-web-v}"
          archive="release-assets/storage-web-$version.pages.zip"
          test -f "$archive"
          test "$(wc -c <"$archive")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          bounded_gh() {
            local output="$1" error status
            shift
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 131072 -a "$(wc -c <"$error")" -le 131072
            if test "$status" = 0; then test ! -s "$error"; fi
            return "$status"
          }
          bounded_local() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 131072 -a "$(wc -c <"$error")" -le 131072
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          verify_draft() {
            local json="$1" id="$2"
            jq -e --arg id "$id" --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.id|tostring)==$id and .tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==true and .prerelease==false and (.immutable==false or .immutable==null) and (.created_at|iso) and .published_at==null and ((.assets|type)=="array")' "$json" >/dev/null
          }
          revalidate_draft_for_publish() {
            local json="$1" id="$2"
            bounded_gh "$json" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$id"
            verify_draft "$json" "$id"
            test "$(jq -c '[.assets[] | {id,name,state,size,digest}] | sort_by(.name)' "$json")" = "$expected_draft_asset_metadata"
            jq -e --arg name "storage-web-${RELEASE_TAG#storage-web-v}.pages.zip" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" '((.assets|type)=="array" and (.assets|length)==1) and (.assets[0]|type=="object" and (.id|type=="number" and .id>0 and floor==.) and .name==$name and .state=="uploaded" and .size==$size and .digest==$digest)' "$json" >/dev/null
          }
          verify_published() {
            local json="$1" id="$2"
            jq -e --arg id "$id" --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" --arg name "storage-web-${RELEASE_TAG#storage-web-v}.pages.zip" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.id|tostring)==$id and .tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==false and .prerelease==false and .immutable==true and (.created_at|iso) and (.published_at|iso) and ((.published_at|fromdateiso8601) >= (.created_at|fromdateiso8601)) and ((.assets|type)=="array" and (.assets|length)==1) and .assets[0].name==$name and .assets[0].state=="uploaded" and .assets[0].size==$size and .assets[0].digest==$digest' "$json" >/dev/null
          }
          download_asset() {
            local json="$1" output="$2" asset_id error status
            asset_id="$(jq -er '.assets[0].id | select(type=="number" and .>0 and floor==.)' "$json")"
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 16777216 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            status="$?"
            set -e
            test "$status" = 0
            test "$(wc -c <"$error")" -le 131072 -a ! -s "$error"
            test "$(wc -c <"$output")" = "$EXPECTED_SIZE"
           test "sha256:$(sha256sum "$output" | awk '{print $1}')" = "$EXPECTED_DIGEST"
           cmp -s "$archive" "$output"
            bounded_local "$output.validation" 300 python3 scripts/validate-pages-archive.py "$output"
          }
          probe="$RUNNER_TEMP/release-probe.json"
          set +e
          bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          probe_status="$?"
          set -e
          if test "$probe_status" != 0; then
            test ! -s "$probe"
            test -s "$probe.err"
            test "$(wc -c <"$probe.err")" -le 131072
            status_probe="$RUNNER_TEMP/release-status"
            set +e
            bounded_gh "$status_probe" api --include --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
            status_probe_exit="$?"
            set -e
            test "$status_probe_exit" != 0
            status_line="$(awk '/^HTTP\/[0-9.]+[[:space:]]/{print; exit}' "$status_probe")"
            [[ "$status_line" =~ ^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$) ]]
            create="$RUNNER_TEMP/release-create.json"
            verify_source
            bounded_gh "$create" api --hostname github.com --method POST --header 'X-GitHub-Api-Version: 2026-03-10' --raw-field "tag_name=$RELEASE_TAG" --raw-field "name=$RELEASE_TAG" --raw-field "body=Release $RELEASE_TAG" --raw-field "target_commitish=$RELEASE_SHA" --field draft=true --field prerelease=false "/repos/$GITHUB_REPOSITORY/releases"
            release_id="$(jq -er '.id | select(type=="number" and .>0 and floor==.)' "$create")"
            bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            release_id="$(jq -er '.id | select(type=="number" and .>0 and floor==.)' "$probe")"
          fi
          state="$(jq -er 'if .draft==true then "draft" elif .draft==false then "published" else empty end' "$probe")"
          case "$state" in
            draft)
              verify_draft "$probe" "$release_id"
              jq -e --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); .body==("Release "+$tag) and .target_commitish==$target and (.created_at|iso) and .published_at==null and ((.assets|length) <= 64) and all(.assets[]; type == "object" and (.id|type == "number" and . > 0 and floor == .))' "$probe" >/dev/null
              asset_ids="$RUNNER_TEMP/release-assets"
              jq -r '.assets[]?.id // empty' "$probe" >"$asset_ids"
              while IFS= read -r asset_id; do
                test -z "$asset_id" || [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
                if test -n "$asset_id"; then
                  verify_source
                  bounded_gh "$RUNNER_TEMP/delete-$asset_id.json" api --hostname github.com --method DELETE --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
              done <"$asset_ids"
              asset_name="storage-web-${RELEASE_TAG#storage-web-v}.pages.zip"
              verify_source
              upload_url="$(jq -er '.upload_url | select(type=="string" and test("^https://uploads\\.github\\.com/repos/[^/]+/[^/]+/releases/[0-9]+/assets\\{\\?name,label\\}$"))' "$probe")"
              upload_url="${upload_url%\{*}"
              test "$upload_url" = "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
              bounded_gh "$RUNNER_TEMP/upload.json" api --hostname github.com --method POST --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/zip' --input "$archive" "$upload_url?name=$asset_name"
              bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              verify_draft "$probe" "$release_id"
              jq -e --arg name "$asset_name" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" '((.assets|length)==1) and .assets[0].name==$name and .assets[0].state=="uploaded" and .assets[0].size==$size and .assets[0].digest==$digest' "$probe" >/dev/null
              expected_draft_asset_metadata="$(jq -c '[.assets[] | {id,name,state,size,digest}] | sort_by(.name)' "$probe")"
              download_asset "$probe" "$RUNNER_TEMP/draft.pages.zip"
              # Revalidate the authoritative tag and current main immediately before the one publish mutation.
              verify_source
              revalidate_draft_for_publish "$probe" "$release_id"
              bounded_gh "$RUNNER_TEMP/published.json" api --hostname github.com --method PATCH --header 'X-GitHub-Api-Version: 2026-03-10' --field draft=false "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              verify_published "$probe" "$release_id"
              download_asset "$probe" "$RUNNER_TEMP/published.pages.zip"
              ;;
            published)
              # Only an exact immutable Release is recoverable on a rerun after downstream failure.
              test "${GITHUB_RUN_ATTEMPT:-1}" -gt 1
              verify_published "$probe" "$release_id"
              download_asset "$probe" "$RUNNER_TEMP/published.pages.zip"
              ;;
            *)
              echo "Release state is neither draft nor published" >&2
              exit 1
              ;;
          esac
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

  deploy:
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_RELEASE_ID: ${{ needs.release.outputs.release_id }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.pages_digest }}
      EXPECTED_SIZE: ${{ needs.build.outputs.pages_size }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Download and verify the immutable Release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#storage-web-v}"
          archive="storage-web-$version.pages.zip"
          bounded_local() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 131072 -a "$(wc -c <"$error")" -le 131072
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          json="$RUNNER_TEMP/release.json"
          error="$json.err"
          set +e
          python3 scripts/bounded-command.py --stdout "$json" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID"
          status="$?"
          set -e
          test "$status" = 0
          test "$(wc -c <"$json")" -le 131072 -a "$(wc -c <"$error")" -le 131072 -a ! -s "$error"
          jq -e --arg id "$EXPECTED_RELEASE_ID" --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" --arg name "$archive" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.id|tostring)==$id and .tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==false and .prerelease==false and .immutable==true and (.created_at|iso) and (.published_at|iso) and ((.published_at|fromdateiso8601) >= (.created_at|fromdateiso8601)) and ((.assets|type)=="array" and (.assets|length)==1) and .assets[0].name==$name and .assets[0].state=="uploaded" and .assets[0].size==$size and .assets[0].digest==$digest' "$json" >/dev/null
          asset_id="$(jq -er '.assets[0].id | select(type=="number" and .>0 and floor==.)' "$json")"
          downloaded="$RUNNER_TEMP/$archive"
          set +e
          python3 scripts/bounded-command.py --stdout "$downloaded" --stderr "$downloaded.err" --max-stdout-bytes 16777216 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          status="$?"
          set -e
          test "$status" = 0
          test "$(wc -c <"$downloaded.err")" -le 131072 -a ! -s "$downloaded.err"
          test "$(wc -c <"$downloaded")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$downloaded" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          bounded_local "$RUNNER_TEMP/storage-archive-validate.out" 300 python3 scripts/validate-pages-archive.py "$downloaded"
          rm -rf dist
          mkdir dist
          bounded_local "$RUNNER_TEMP/storage-archive-unzip.out" 300 unzip -q "$downloaded" -d dist
          test "$(cat dist/CNAME)" = storage.telecrypt.io
      # Pages must consume the verified immutable Release only after publication has completed.
      - uses: actions/configure-pages@v6.0.0
      - name: Revalidate source before Pages upload
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          d="$RUNNER_TEMP/pages-source-upload"
          mkdir -p "$d"
          set +e
          python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          status="$?"
          set -e
          test "$status" = 0 -a "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536 -a ! -s "$d/out" -a ! -s "$d/err"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA" -a "$(git rev-parse HEAD)" = "$RELEASE_SHA" -a "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
      - uses: actions/upload-pages-artifact@v5.0.0
        with: {path: dist}
      - name: Revalidate source before Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          d="$RUNNER_TEMP/pages-source-deploy"
          mkdir -p "$d"
          set +e
          python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          status="$?"
          set -e
          test "$status" = 0 -a "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536 -a ! -s "$d/out" -a ! -s "$d/err"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA" -a "$(git rev-parse HEAD)" = "$RELEASE_SHA" -a "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
