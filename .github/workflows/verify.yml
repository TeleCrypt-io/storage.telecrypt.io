name: Verify storage site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_HOMESERVER: https://backend.telecrypt.io
          VITE_OIDC_ISSUER: https://backend.telecrypt.io/auth/
