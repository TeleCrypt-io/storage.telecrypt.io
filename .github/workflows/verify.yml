name: Verify storage site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_PARAMETERS: ""
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /bin/false
      SSH_ASKPASS: /bin/false
      GCM_INTERACTIVE: never
      GIT_ALLOW_PROTOCOL: https
      GIT_PROTOCOL_FROM_USER: "0"
      GH_HOST: github.com
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable Release workflow invariants
        run: node scripts/verify-release-workflow.mjs

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.20.0"
          cache: "npm"

      - name: Require exact immutable shared UI release
        run: bash scripts/verify-shared-ui-release.sh

      - name: Require exact immutable SDK release record and package bytes
        shell: bash
        run: |
          set -euo pipefail
          sdk_tag=v0.5.10
          sdk_release="$RUNNER_TEMP/storage-sdk-release.json"
          sdk_record="$RUNNER_TEMP/storage-sdk-release.integrity.json"
          sdk_archive="$RUNNER_TEMP/storage-sdk-release.tgz"
          record_name="$sdk_tag.integrity.json"
          archive_name="$sdk_tag.tgz"
          python3 scripts/bounded-command.py --stdout "$sdk_release" --stderr "$sdk_release.err" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/TeleCrypt-io/storage-sdk/releases/tags/$sdk_tag"
          jq -e --arg tag "$sdk_tag" --arg record "$record_name" --arg archive "$archive_name" '(.tag_name==$tag and .draft==false and .prerelease==false and .immutable==true and (.target_commitish|type=="string" and test("^[0-9a-f]{40}$")) and (.assets|type=="array" and length==2) and all(.assets[]; type=="object" and (.id|type=="number" and .>0) and .state=="uploaded") and any(.assets[]; type=="object" and .name==$record and .state=="uploaded" and (.size|type=="number" and .>0) and (.digest|type=="string" and test("^sha256:[0-9a-f]{64}$"))) and any(.assets[]; type=="object" and .name==$archive and .state=="uploaded" and (.size|type=="number" and .>0) and (.digest|type=="string" and test("^sha256:[0-9a-f]{64}$"))))' "$sdk_release" >/dev/null
          record_id="$(jq -er --arg name "$record_name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$sdk_release")"
          record_size="$(jq -er --arg name "$record_name" '.assets[] | select(.name==$name) | .size | select(type=="number" and .>0 and floor==.)' "$sdk_release")"
          record_digest="$(jq -er --arg name "$record_name" '.assets[] | select(.name==$name) | .digest | select(type=="string" and test("^sha256:[0-9a-f]{64}$"))' "$sdk_release")"
          python3 scripts/bounded-command.py --stdout "$sdk_record" --stderr "$sdk_record.err" --max-stdout-bytes 104857600 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/TeleCrypt-io/storage-sdk/releases/assets/$record_id"
          test "$(wc -c <"$sdk_record")" = "$record_size" -a "sha256:$(sha256sum "$sdk_record" | awk '{print $1}')" = "$record_digest" -a ! -s "$sdk_record.err"
          archive_id="$(jq -er --arg name "$archive_name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$sdk_release")"
          python3 scripts/bounded-command.py --stdout "$sdk_archive" --stderr "$sdk_archive.err" --max-stdout-bytes 104857600 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/TeleCrypt-io/storage-sdk/releases/assets/$archive_id"
          test ! -s "$sdk_archive.err"
          test "$(jq -er '.commit' "$sdk_record")" = "$(jq -er '.target_commitish' "$sdk_release")"
          node scripts/verify-storage-sdk-lock.mjs "$sdk_record" "$sdk_archive"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
          bounded_command "$RUNNER_TEMP/storage-npm-ci.out" 600 npm ci --ignore-scripts --no-fund --no-audit --loglevel=error

      - name: Verify license and vendored UI provenance
        run: |
          set -euo pipefail
          test "$(head -n 1 LICENSE)" = "Business Source License 1.1"
          node scripts/verify-provenance.mjs

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() { local output="$1" seconds="$2" status error; shift 2; error="$output.err"; set +e; python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"; status="$?"; set -e; test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288; test "$status" = 0; test ! -s "$error"; ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"; }
          bounded_command "$RUNNER_TEMP/storage-lint.out" 300 npm run lint --loglevel=error

      - name: Verify security policy contract
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() { local output="$1" seconds="$2" status error; shift 2; error="$output.err"; set +e; python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"; status="$?"; set -e; test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288; test "$status" = 0; test ! -s "$error"; ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"; }
          bounded_command "$RUNNER_TEMP/storage-verify-security.out" 300 npm run verify:security --loglevel=error

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() { local output="$1" seconds="$2" status error; shift 2; error="$output.err"; set +e; python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"; status="$?"; set -e; test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288; test "$status" = 0; test ! -s "$error"; ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"; }
          bounded_command "$RUNNER_TEMP/storage-test.out" 600 npm test --loglevel=error

      - name: Test Pages archive validation
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() { local output="$1" seconds="$2" status error; shift 2; error="$output.err"; set +e; python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds 300 --kill-after-seconds 5 -- "$@"; status="$?"; set -e; test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288; test "$status" = 0; test ! -s "$error"; ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"; }
          bounded_command "$RUNNER_TEMP/storage-verify-archive.out" 300 npm run verify:archive --loglevel=error

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() { local output="$1" seconds="$2" status error; shift 2; error="$output.err"; set +e; python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"; status="$?"; set -e; test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288; test "$status" = 0; test ! -s "$error"; ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"; }
          bounded_command "$RUNNER_TEMP/storage-build.out" 600 npm run build --loglevel=error

      - name: Verify Pages packaging
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() { local output="$1" seconds="$2" status error; shift 2; error="$output.err"; set +e; python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds 300 --kill-after-seconds 5 -- "$@"; status="$?"; set -e; test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288; test "$status" = 0; test ! -s "$error"; ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"; }
          bounded_command "$RUNNER_TEMP/storage-verify-package.out" 300 npm run verify:package --loglevel=error
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bounded-command.py
