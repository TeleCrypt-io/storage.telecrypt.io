name: Verify storage site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: |
          test -s public/runtime-settings.json
          node -e 'const s = require("./public/runtime-settings.json"); if (s.homeserver !== "https://backend.telecrypt.io") process.exit(1)'
          npm run build
