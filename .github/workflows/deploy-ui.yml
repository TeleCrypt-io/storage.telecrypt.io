name: Deploy storage site to GitHub Pages

on:
  push:
    tags: ["storage-web-v*"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated immutable release tag
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Require a tag matching the package version
        run: |
          expected_version="${GITHUB_REF_NAME#storage-web-v}"
          package_version="$(node -e 'console.log(require("./package.json").version)')"
          test "$expected_version" = "$package_version"

      - name: Install exact dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm test

      - name: Build
        run: |
          npm run build
        env:
          VITE_HOMESERVER: https://backend.telecrypt.io

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
